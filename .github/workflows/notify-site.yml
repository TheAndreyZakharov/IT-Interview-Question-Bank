name: Notify site repository

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  notify-site:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger IT-Interview rebuild
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/TheAndreyZakharov/IT-Interview/dispatches \
            -d '{"event_type":"question_bank_updated","client_payload":{"source_repo":"IT-Interview-Question-Bank","source_branch":"main"}}'